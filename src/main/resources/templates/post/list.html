<html lang="ko" 
    xmlns:th="http://www.thymeleaf.org" 
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layouts/default}">
        
        <section layout:fragment="contents" class="contents d-flex justify-content-center">
			<div class="contents-box my-5">
				<h1 class="text-center">메모 리스트</h1>
				<table class="table text-center mt-4">
					<thead>
						<tr>
							<th>No</th>
							<th>제목</th>
							<th>작성 날짜</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="post:${postList}">
							<td th:text="${post.id}">2423</td>
							<td><a th:href="|/post/detail-view?id=${post.id}|" th:text="${post.title}">메모의 예시 입니다.</a></td>
							<td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}">2025-08-12</td>
						</tr>
					
					</tbody>
				</table>
				
				<div class="d-flex justify-content-end mt-2">
					<a href="/post/create-view" class="btn btn-secondary">메모 쓰기</a>
				</div>
        	</div>
        </section>
        
</html>
